{{- if not (.Page.Param "hideLike") }}

<link rel="stylesheet"
      href="https://unpkg.com/applause-button/dist/applause-button.css">

<script defer
        src="https://unpkg.com/applause-button/dist/applause-button.js">
</script>

<style>
  .applause-wrapper {
    clear: both !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    margin-top: 60px !important;
    margin-bottom: 140px !important;
    padding: 10px 0 !important;
    box-sizing: border-box !important;
  }

  .applause-wrapper applause-button {
    display: inline-block !important;
    width: 60px !important;
    height: 60px !important;
    margin: 0 auto !important;
    flex-shrink: 0 !important;
  }

  .applause-wrapper applause-button .hands-flat path:first-child,
  .applause-wrapper applause-button .hands-outline path {
    d: path("M30 48.35 l-2.9-2.64 C16.8 36.37 10 30.21 10 22.65 C10 16.49 14.84 11.65 21 11.65 c3.48 0 6.82 1.62 9 4.18 C32.18 13.27 35.52 11.65 39 11.65 C45.16 11.65 50 16.49 50 22.65 c0 7.56-6.8 13.72-17.1 23.08 L30 48.35z") !important;
    fill: #e63946 !important;
  }

  .applause-wrapper applause-button .hands-flat path:not(:first-child) {
    display: none !important;
  }

  .applause-prompt {
    font-size: 1.5rem !important;
    color: var(--secondary, #7c7c7c) !important;
    margin-top: 60px !important;
    margin-bottom: 0 !important;
    font-style: italic !important;
    letter-spacing: 0.3px !important;
    text-align: center !important;
  }
</style>

<div class="applause-wrapper">
  <applause-button
    api="https://applause.chabouis.fr"
    url="{{ .Page.Permalink }}"
    color="red"
    max-claps="1">
  </applause-button>

  <p class="applause-prompt">
    Press like if you found it useful!
  </p>
</div>

<script>
  (() => {
    const script = document.currentScript;
    const wrapper = script.previousElementSibling;
    const button = wrapper?.querySelector("applause-button");

    if (!button || button.dataset.geoTrackingAttached === "true") {
      return;
    }

    button.dataset.geoTrackingAttached = "true";

    button.addEventListener(
      "clapped",
      () => {
        const pageUrl =
          button.getAttribute("url") || window.location.href;

        fetch("https://blog-like.yunyang-mo.workers.dev/like", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            url: pageUrl
          }),
          keepalive: true
        }).catch((error) => {
          console.warn("Could not record like location:", error);
        });
      },
      { once: true }
    );
  })();
</script>

{{- end }}
